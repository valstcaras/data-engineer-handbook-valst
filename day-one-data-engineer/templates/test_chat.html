<!DOCTYPE html>
<html>
<head>
    <title>Test AI Chat</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        #messages { border: 1px solid #ddd; height: 300px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .message { margin: 5px 0; padding: 5px; }
        .user { background: #e3f2fd; }
        .agent { background: #f5f5f5; }
        .error { background: #ffebee; color: red; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 20px; }
    </style>
</head>
<body>
    <h2>Test AI Chat Endpoint</h2>
    <div id="messages"></div>
    <input type="text" id="input" placeholder="Type a message...">
    <button onclick="send()">Send</button>
    <button onclick="testEndpoint()">Test Endpoint</button>
    
    <script>
    function addMsg(type, text) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.textContent = text;
        document.getElementById('messages').appendChild(div);
    }
    
    function testEndpoint() {
        addMsg('user', 'Testing /agent/chat endpoint...');
        fetch('/agent/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: 'test',
                user_id: 'test-user'
            })
        })
        .then(r => {
            addMsg('user', `Status: ${r.status}`);
            return r.json();
        })
        .then(data => {
            addMsg('agent', JSON.stringify(data, null, 2));
        })
        .catch(err => {
            addMsg('error', 'Error: ' + err.message);
        });
    }
    
    function send() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;
        
        addMsg('user', 'You: ' + msg);
        input.value = '';
        
        fetch('/agent/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: msg,
                user_id: 'test-user',
                attempt_id: 'test-attempt'
            })
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                addMsg('error', 'Error: ' + data.error);
            } else {
                addMsg('agent', 'Agent: ' + data.response);
            }
        })
        .catch(err => {
            addMsg('error', 'Error: ' + err.message);
        });
    }
    
    document.getElementById('input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') send();
    });
    </script>
</body>
</html>
