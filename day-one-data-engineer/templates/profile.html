<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Day One</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        header { background: #FF3621; color: white; padding: 1.5rem; }
        header a { color: white; text-decoration: none; margin-right: 1rem; }
        main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .profile-section { background: white; border-radius: 8px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .profile-section h2 { color: #FF3621; margin-bottom: 1rem; }
        .verdict { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 2rem; border-radius: 8px; font-size: 1.1rem; line-height: 1.8; }
        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .category-card { padding: 1rem; background: #f5f5f5; border-radius: 6px; }
        .category-card h3 { font-size: 0.9rem; color: #666; margin-bottom: 0.5rem; }
        .score { font-size: 1.5rem; font-weight: bold; color: #FF3621; }
        .chart { height: 300px; margin: 1rem 0; }
    </style>
</head>
<body>
    <header>
        <a href="/">← Back to Scenarios</a>
        <h1>My Interest Profile</h1>
    </header>
    
    <main>
        <div class="profile-section">
            <h2>🎯 Your Career Direction</h2>
            <div class="verdict" id="verdict">
                Complete more scenarios to get your personalized career recommendation!
            </div>
        </div>

        <div class="profile-section">
            <h2>📊 Category Strengths</h2>
            <div class="categories-grid" id="categories">
                <!-- Categories loaded via JavaScript -->
            </div>
        </div>

        <div class="profile-section">
            <h2>📚 Recommended Learning</h2>
            <div id="recommendations">
                <!-- Recommendations loaded via JavaScript -->
            </div>
        </div>

        <div class="profile-section">
            <h2>🎮 Scenario History</h2>
            <div id="history">
                <!-- History loaded via JavaScript -->
            </div>
        </div>
    </main>

    <script>
        async function loadProfile() {
            // In production: GET /api/profile
            const mockProfile = {
                verdict: "You're showing strong aptitude for data quality and pipeline design work. Consider roles like Analytics Engineer or Data Platform Engineer.",
                categories: {
                    data_quality: {enjoyment: [4, 5, 4], competence: [0.8, 0.9, 0.85]},
                    pipeline_design: {enjoyment: [5, 4], competence: [0.7, 0.8]},
                    incident_debugging: {enjoyment: [3], competence: [0.6]}
                }
            };

            if (mockProfile.verdict) {
                document.getElementById('verdict').textContent = mockProfile.verdict;
            }

            const categoriesDiv = document.getElementById('categories');
            categoriesDiv.innerHTML = Object.entries(mockProfile.categories).map(([cat, data]) => {
                const avgEnjoyment = (data.enjoyment.reduce((a,b) => a+b, 0) / data.enjoyment.length).toFixed(1);
                const avgCompetence = (data.competence.reduce((a,b) => a+b, 0) / data.competence.length).toFixed(2);
                return `
                    <div class="category-card">
                        <h3>${cat.replace('_', ' ').toUpperCase()}</h3>
                        <div><strong>Enjoyment:</strong> <span class="score">${avgEnjoyment}/5</span></div>
                        <div><strong>Competence:</strong> <span class="score">${(avgCompetence * 100).toFixed(0)}%</span></div>
                    </div>
                `;
            }).join('');
        }

        loadProfile();
    </script>
</body>
</html>
