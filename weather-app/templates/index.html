<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Alert & Forecast API</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        input, textarea, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 100px;
            font-family: monospace;
            resize: vertical;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .search-results {
            margin-top: 20px;
        }
        .search-result-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .search-result-item h3 {
            color: #333;
            margin-bottom: 5px;
        }
        .search-result-item .meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .search-result-item .text {
            color: #444;
            line-height: 1.6;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        .example-locations {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .example-locations code {
            background: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Alert & Forecast API</h1>
            <p>Semantic search over NWS weather data powered by vector embeddings</p>
        </div>

        <div class="card">
            <h2>🔄 Sync Weather Data</h2>
            <form id="syncForm">
                <div class="form-group">
                    <label for="locations">Locations (JSON array)</label>
                    <textarea id="locations" placeholder='[{"label": "Chicago, IL", "lat": 41.88, "lon": -87.63}]'>[
  {"label": "Chicago, IL", "lat": 41.88, "lon": -87.63},
  {"label": "Austin, TX", "lat": 30.27, "lon": -97.74},
  {"label": "New York, NY", "lat": 40.71, "lon": -74.01}
]</textarea>
                    <div class="example-locations">
                        <strong>Example locations:</strong><br>
                        San Francisco: <code>37.77, -122.42</code> | 
                        Miami: <code>25.76, -80.19</code> | 
                        Seattle: <code>47.61, -122.33</code>
                    </div>
                </div>
                <div class="form-group">
                    <label for="limit">Limit (max documents per location)</label>
                    <input type="number" id="limit" value="50" min="1" max="500">
                </div>
                <button type="submit" id="syncBtn">Sync Weather Data</button>
            </form>
            <div id="syncResult" class="result"></div>
        </div>

        <div class="card">
            <h2>🔍 Search Weather Documents</h2>
            <form id="searchForm">
                <div class="form-group">
                    <label for="query">Search Query</label>
                    <input type="text" id="query" placeholder="e.g., severe thunderstorm warnings in Chicago" required>
                </div>
                <div class="form-group">
                    <label for="topK">Number of Results</label>
                    <input type="number" id="topK" value="5" min="1" max="50">
                </div>
                <button type="submit" id="searchBtn">Search</button>
            </form>
            <div id="searchResult" class="result"></div>
            <div id="searchResults" class="search-results"></div>
        </div>
    </div>

    <script>
        // Sync form handler
        document.getElementById('syncForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const syncBtn = document.getElementById('syncBtn');
            const resultDiv = document.getElementById('syncResult');
            
            syncBtn.disabled = true;
            syncBtn.textContent = 'Syncing...';
            resultDiv.style.display = 'none';
            
            try {
                const locations = JSON.parse(document.getElementById('locations').value);
                const limit = parseInt(document.getElementById('limit').value);
                
                const response = await fetch('/weather/sync', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ locations, limit })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = `✅ Success! Synced ${data.documents_synced} documents from ${data.locations_processed.length} locations: ${data.locations_processed.join(', ')}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Error: ${data.error || 'Unknown error'}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
            } finally {
                syncBtn.disabled = false;
                syncBtn.textContent = 'Sync Weather Data';
                resultDiv.style.display = 'block';
            }
        });

        // Search form handler
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const searchBtn = document.getElementById('searchBtn');
            const resultDiv = document.getElementById('searchResult');
            const resultsDiv = document.getElementById('searchResults');
            
            searchBtn.disabled = true;
            searchBtn.textContent = 'Searching...';
            resultDiv.style.display = 'none';
            resultsDiv.innerHTML = '<div class="loading">🔍 Searching...</div>';
            
            try {
                const query = document.getElementById('query').value;
                const top_k = parseInt(document.getElementById('topK').value);
                
                const response = await fetch('/weather/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query, top_k })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.results && data.results.length > 0) {
                        resultsDiv.innerHTML = data.results.map((result, idx) => `
                            <div class="search-result-item">
                                <h3>Result ${idx + 1} (Similarity: ${(result.similarity * 100).toFixed(1)}%)</h3>
                                <div class="meta">
                                    <strong>Location:</strong> ${result.location || 'N/A'} | 
                                    <strong>Type:</strong> ${result.source_type || 'N/A'}
                                    ${result.event ? ` | <strong>Event:</strong> ${result.event}` : ''}
                                </div>
                                <div class="text">${result.chunk_text}</div>
                            </div>
                        `).join('');
                    } else {
                        resultsDiv.innerHTML = '<div class="result error">No results found. Try syncing weather data first or try a different query.</div>';
                    }
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.textContent = `❌ Error: ${data.error || 'Unknown error'}`;
                    resultDiv.style.display = 'block';
                    resultsDiv.innerHTML = '';
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `❌ Error: ${error.message}`;
                resultDiv.style.display = 'block';
                resultsDiv.innerHTML = '';
            } finally {
                searchBtn.disabled = false;
                searchBtn.textContent = 'Search';
            }
        });
    </script>
</body>
</html>
